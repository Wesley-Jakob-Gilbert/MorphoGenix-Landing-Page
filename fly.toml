# fly.toml app configuration file for morphogenix-landing-page-1-2pra (PROD).
#
# DO NOT REGENERATE THIS FILE with `fly launch` from the project root \u2014
# that command rewrites `app = ...` in-place and will silently retarget
# production deploys at whatever new app you were creating. If you need to
# create a new Fly app (e.g. for staging or a preview env), pass
# `--config fly.<env>.toml` so this file stays untouched.

app = 'morphogenix-landing-page-1-2pra'
primary_region = 'dfw'

[build]

[env]
  APP_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'
    protocol = 'http'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
